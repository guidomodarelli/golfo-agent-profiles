name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # A push to main is never cancelled: its release must run once its checks pass.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pack:
    name: Content pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: pack
          fetch-depth: 0
      # The engine that projects this content: agent-ready-setup of golfo-agent-ready, from the marketplace.
      - uses: actions/checkout@v4
        with:
          repository: guidomodarelli/golfo-marketplace
          ref: main
          path: marketplace
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests of the checks
        working-directory: pack
        run: python3 -m unittest discover -s tests -v
      - name: Catalog, skills, version and a projection of every profile
        working-directory: pack
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          ENGINE_DIR: ${{ github.workspace }}/marketplace/plugins/golfo-agent-ready/skills/agent-ready-setup
        run: |
          arguments=(--engine "$ENGINE_DIR")
          if [[ -n "$BASE_REF" ]]; then
            arguments+=(--base "$BASE_REF")
          fi
          python3 scripts/check_pack.py "${arguments[@]}"

  # Only a commit of main whose checks passed publishes its version: a tag never moves, so a broken
  # one would stay for every consumer that pins it.
  release:
    name: Tag and release the version
    needs: pack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Publish v<version> of agent-ready-pack.json once
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py
