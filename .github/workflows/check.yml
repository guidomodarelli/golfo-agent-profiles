name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: Content pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: pack
          fetch-depth: 0
      # The engine that projects this content: agent-ready-setup of golfo-kit, from the marketplace.
      - uses: actions/checkout@v4
        with:
          repository: guidomodarelli/golfo-marketplace
          ref: main
          path: marketplace
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests of the checks
        working-directory: pack
        run: python3 -m unittest discover -s tests -v
      - name: Catalog, skills, version and a projection of every profile
        working-directory: pack
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          ENGINE_DIR: ${{ github.workspace }}/marketplace/plugins/golfo-kit/skills/agent-ready-setup
        run: |
          arguments=(--engine "$ENGINE_DIR")
          if [[ -n "$BASE_REF" ]]; then
            arguments+=(--base "$BASE_REF")
          fi
          python3 scripts/check_pack.py "${arguments[@]}"
